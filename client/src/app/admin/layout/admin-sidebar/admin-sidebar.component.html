<nav class="admin-sidebar" [class.is-open]="isMobileOpen" role="navigation" aria-label="Admin navigation">
  <!-- Mobile overlay -->
  <div class="admin-sidebar__overlay" *ngIf="isMobileOpen" (click)="closeMobile()" aria-hidden="true"></div>

  <div class="admin-sidebar__inner">
    <!-- Header drawer dành cho mobile/tablet -->
    <div class="admin-sidebar__mobile-top">
      <div class="admin-sidebar__mobile-brand">
        <span class="admin-sidebar__mobile-title">Chéri</span>

      </div>
      <button type="button" class="admin-sidebar__close-btn" (click)="closeMobile()" aria-label="Đóng menu quản trị"
        title="Đóng menu">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
          stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    <ul class="admin-sidebar__nav" role="list">
      <li class="admin-sidebar__item" *ngFor="let item of navItems">
        <a [routerLink]="item.route" routerLinkActive="is-active"
          [routerLinkActiveOptions]="item.exact ? { exact: true } : { exact: false }" class="admin-sidebar__link"
          [attr.aria-current]="isActive(item.route) ? 'page' : null" (click)="closeMobile()" [attr.title]="item.label"
          [attr.aria-label]="item.label">
          <span class="admin-sidebar__icon-wrap" aria-hidden="true" [ngSwitch]="item.icon">
            <!-- Dashboard -->
            <svg *ngSwitchCase="'dashboard'" class="admin-sidebar__icon" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="7" height="9"></rect>
              <rect x="14" y="3" width="7" height="5"></rect>
              <rect x="14" y="12" width="7" height="9"></rect>
              <rect x="3" y="16" width="7" height="5"></rect>
            </svg>

            <!-- Sản phẩm -->
            <svg *ngSwitchCase="'products'" class="admin-sidebar__icon" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
              <line x1="3" y1="6" x2="21" y2="6"></line>
              <path d="M16 10a4 4 0 0 1-8 0"></path>
            </svg>

            <!-- Danh mục -->
            <svg *ngSwitchCase="'categories'" class="admin-sidebar__icon" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
              <line x1="12" y1="11" x2="12" y2="17"></line>
              <line x1="9" y1="14" x2="15" y2="14"></line>
            </svg>

            <!-- Đơn hàng -->
            <svg *ngSwitchCase="'orders'" class="admin-sidebar__icon" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"></path>
              <rect x="9" y="3" width="6" height="4" rx="2"></rect>
              <path d="M9 14l2 2 4-4"></path>
            </svg>

            <!-- Mã giảm giá -->
            <svg *ngSwitchCase="'coupons'" class="admin-sidebar__icon" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"></path>
              <line x1="7" y1="7" x2="7.01" y2="7"></line>
            </svg>

            <!-- Phương thức thanh toán -->
            <svg *ngSwitchCase="'payment-methods'" class="admin-sidebar__icon" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect>
              <line x1="1" y1="10" x2="23" y2="10"></line>
            </svg>

            <!-- Đơn vị vận chuyển -->
            <svg *ngSwitchCase="'shipping-methods'" class="admin-sidebar__icon" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="1" y="3" width="15" height="13"></rect>
              <polygon points="16 8 20 8 23 11 23 16 16 16 16 8"></polygon>
              <circle cx="5.5" cy="18.5" r="2.5"></circle>
              <circle cx="18.5" cy="18.5" r="2.5"></circle>
            </svg>

            <!-- Tài khoản -->
            <svg *ngSwitchCase="'users'" class="admin-sidebar__icon" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
              <circle cx="9" cy="7" r="4"></circle>
              <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
              <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
            </svg>

            <!-- Quản lý tồn kho -->
            <svg *ngSwitchCase="'inventory'" class="admin-sidebar__icon" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="21 8 21 21 3 21 3 8"></polyline>
              <rect x="1" y="3" width="22" height="5"></rect>
              <line x1="10" y1="12" x2="14" y2="12"></line>
            </svg>


            <!-- Quản lý trang -->
            <svg *ngSwitchCase="'pages'" class="admin-sidebar__icon" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
              <polyline points="14 2 14 8 20 8"></polyline>
              <line x1="16" y1="13" x2="8" y2="13"></line>
              <line x1="16" y1="17" x2="8" y2="17"></line>
              <line x1="10" y1="9" x2="8" y2="9"></line>
            </svg>
          </span>

          <span class="admin-sidebar__link-text">{{ item.label }}</span>
          <span class="admin-sidebar__tooltip" aria-hidden="true">{{ item.label }}</span>
        </a>
      </li>
    </ul>
  </div>
</nav>
