<div
  class="dialog-backdrop"
  (click)="onBackdropClick($event)"
  role="dialog"
  aria-modal="true"
  aria-labelledby="cancel-dialog-title"
>
  <div class="dialog-card">

    <!-- Card Header -->
    <div class="dialog-header">
      <div class="dialog-title-group">
        <h3 class="dialog-title" id="cancel-dialog-title">Hủy đặt hàng</h3>
        <span class="dialog-order-badge" *ngIf="order?.orderId">
          Mã đơn: #{{ order.orderId }}
        </span>
      </div>
      <button
        type="button"
        class="dialog-close-btn"
        (click)="onClose()"
        [disabled]="isSubmitting"
        title="Đóng"
        aria-label="Đóng popup"
      >
        <svg class="dialog-close-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    <!-- Card Body -->
    <div class="dialog-body">
      <p class="dialog-subtitle">
        Vui lòng chọn một lý do hủy đơn hàng:
      </p>

      <!-- Reason Radio Group -->
      <div class="reasons-list" role="radiogroup" aria-label="Danh sách lý do hủy đơn">
        <label
          *ngFor="let reason of cancelReasons; let idx = index"
          class="reason-item"
          [class.selected]="selectedReason === reason"
          [class.disabled]="isSubmitting"
        >
          <input
            type="radio"
            name="cancelReasonOption"
            [value]="reason"
            [checked]="selectedReason === reason"
            (change)="onSelectReason(reason)"
            [disabled]="isSubmitting"
            class="reason-input"
          />
          <span class="radio-indicator"></span>
          <span class="reason-text">{{ reason }}</span>
        </label>
      </div>

      <!-- Other reason textarea -->
      <div class="other-reason-section" *ngIf="isOtherSelected()">
        <label for="other-reason-input" class="other-reason-label">
          Chi tiết lý do khác <span class="required-mark">*</span>
        </label>
        <textarea
          id="other-reason-input"
          class="other-reason-textarea"
          [(ngModel)]="otherReason"
          (ngModelChange)="validationError = ''"
          [disabled]="isSubmitting"
          rows="3"
          maxlength="300"
          placeholder="Vui lòng nhập lý do cụ thể bạn muốn hủy đơn hàng..."
        ></textarea>
        <div class="other-reason-footer">
          <span class="validation-hint" *ngIf="!validationError">Tối thiểu 3 ký tự</span>
          <span class="char-count">{{ (otherReason || '').length }}/300</span>
        </div>
      </div>

      <!-- Validation Error Notification -->
      <div class="dialog-alert alert-validation" *ngIf="validationError">
        <svg class="alert-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <span class="alert-text">{{ validationError }}</span>
      </div>

      <!-- Server API Error Notification (retains selection for retry) -->
      <div class="dialog-alert alert-server" *ngIf="errorMessage">
        <svg class="alert-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <span class="alert-text">{{ errorMessage }}</span>
      </div>
    </div>

    <!-- Card Footer -->
    <div class="dialog-footer">
      <button
        type="button"
        class="btn-dialog-back"
        (click)="onClose()"
        [disabled]="isSubmitting"
      >
        Quay lại
      </button>

      <button
        type="button"
        class="btn-dialog-confirm"
        (click)="onConfirmCancel()"
        [disabled]="isSubmitting"
      >
        <span class="btn-spinner" *ngIf="isSubmitting"></span>
        <span>{{ isSubmitting ? 'Đang gửi yêu cầu...' : 'Xác nhận hủy' }}</span>
      </button>
    </div>

  </div>
</div>
