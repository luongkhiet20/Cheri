<form class="chatbot-input-form" (ngSubmit)="submit()">
  <textarea
    #composer
    class="chatbot-textarea"
    rows="1"
    [placeholder]="placeholder"
    [disabled]="disabled"
    [(ngModel)]="draft"
    name="messageDraft"
    (keydown)="onKeyDown($event)"
    aria-label="Nội dung tin nhắn"
  ></textarea>

  <button
    type="submit"
    class="chatbot-send-btn"
    [disabled]="disabled || !draft.trim()"
    aria-label="Gửi lời nhắn"
  >
    <svg
      xmlns="http://www.w3.org/2000/svg"
      width="18"
      height="18"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      class="lucide lucide-send"
      aria-hidden="true"
    >
      <path d="m22 2-7 20-4-9-9-4Z" />
      <path d="M22 2 11 13" />
    </svg>
  </button>
</form>
