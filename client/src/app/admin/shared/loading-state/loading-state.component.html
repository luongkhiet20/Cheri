<div class="loading-state" [class.loading-state--overlay]="overlay" [class.loading-state--dashboard]="type === 'dashboard'" role="status" aria-live="polite" aria-label="Đang tải">
  <ng-container *ngIf="type === 'spinner'">
    <div class="loading-state__spinner-box">
      <div class="loading-spinner" aria-hidden="true">
        <div class="loading-spinner__ring"></div>
      </div>
      <p class="loading-state__text">{{ message }}</p>
    </div>
  </ng-container>

  <ng-container *ngIf="type === 'skeleton'">
    <div class="skeleton-table">
      <div class="skeleton-row skeleton-row--header">
        <div class="skeleton-cell skeleton-cell--wide"></div>
        <div class="skeleton-cell"></div>
        <div class="skeleton-cell"></div>
        <div class="skeleton-cell skeleton-cell--narrow"></div>
        <div class="skeleton-cell skeleton-cell--narrow"></div>
      </div>
      <div class="skeleton-row" *ngFor="let r of skeletonRows">
        <div class="skeleton-cell skeleton-cell--wide skeleton-cell--animated"></div>
        <div class="skeleton-cell skeleton-cell--animated"></div>
        <div class="skeleton-cell skeleton-cell--animated"></div>
        <div class="skeleton-cell skeleton-cell--narrow skeleton-cell--animated"></div>
        <div class="skeleton-cell skeleton-cell--narrow skeleton-cell--animated"></div>
      </div>
    </div>
  </ng-container>

  <ng-container *ngIf="type === 'dashboard'">
    <div class="skeleton-dashboard">
      <div class="skeleton-dashboard__kpi-grid">
        <div class="skeleton-dashboard__kpi-card" *ngFor="let i of [1, 2, 3, 4]">
          <div class="skeleton-dashboard__line w-40 mb-2 skeleton-cell--animated"></div>
          <div class="skeleton-dashboard__line w-70 mb-3 h-7 skeleton-cell--animated"></div>
          <div class="skeleton-dashboard__line w-50 skeleton-cell--animated"></div>
        </div>
      </div>
      <div class="skeleton-dashboard__charts-grid">
        <div class="skeleton-dashboard__chart-card skeleton-cell--animated"></div>
        <div class="skeleton-dashboard__chart-card skeleton-cell--animated"></div>
      </div>
    </div>
  </ng-container>
</div>
