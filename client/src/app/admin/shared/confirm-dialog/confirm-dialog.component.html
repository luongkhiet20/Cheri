<div class="dialog-overlay" *ngIf="isOpen" (click)="onOverlayClick()" role="dialog" aria-modal="true" [attr.aria-label]="title">
  <div class="dialog-panel" (click)="$event.stopPropagation()">
    <div class="dialog-header">
      <div class="dialog-title-group">
        <!-- SVG Icon tương ứng -->
        <div class="dialog-icon" *ngIf="iconType" [ngClass]="'dialog-icon--' + iconType" aria-hidden="true">
          <!-- accept (check / tiếp nhận) -->
          <svg *ngIf="iconType === 'accept'" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
          <!-- return (quay lại / trả hội thoại) -->
          <svg *ngIf="iconType === 'return'" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="1 4 1 10 7 10"></polyline>
            <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
          </svg>
          <!-- close / danger (kết thúc / đóng) -->
          <svg *ngIf="iconType === 'close' || iconType === 'danger'" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="15" y1="9" x2="9" y2="15"></line>
            <line x1="9" y1="9" x2="15" y2="15"></line>
          </svg>
          <!-- warning -->
          <svg *ngIf="iconType === 'warning'" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
          <!-- info -->
          <svg *ngIf="iconType === 'info'" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="16" x2="12" y2="12"></line>
            <line x1="12" y1="8" x2="12.01" y2="8"></line>
          </svg>
        </div>
        <h2 class="dialog-title">{{ title }}</h2>
      </div>

      <button class="dialog-close" [disabled]="isLoading" (click)="onCancel()" aria-label="Đóng">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    <div class="dialog-body">
      <p class="dialog-message">{{ message }}</p>
      <!-- Thông báo lỗi khi API thất bại -->
      <div class="dialog-error" *ngIf="errorMessage">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <span>{{ errorMessage }}</span>
      </div>
    </div>

    <div class="dialog-footer">
      <button class="btn btn-secondary" [disabled]="isLoading" (click)="onCancel()" id="dialog-cancel">{{ cancelLabel }}</button>
      <button [ngClass]="confirmBtnClass" [disabled]="isLoading" (click)="onConfirm()" id="dialog-confirm">
        <span class="dialog-spinner" *ngIf="isLoading" aria-hidden="true"></span>
        <span>{{ isLoading ? 'Đang xử lý...' : confirmLabel }}</span>
      </button>
    </div>
  </div>
</div>
