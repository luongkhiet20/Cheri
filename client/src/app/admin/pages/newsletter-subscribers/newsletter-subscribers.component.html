<div class="page-content">

  <!-- Page Header -->
  <div class="page-top">
    <div>
      <app-admin-breadcrumb [items]="breadcrumbItems"></app-admin-breadcrumb>
      <h1 class="page-title">Đăng ký nhận ưu đãi</h1>
    </div>
    <div class="page-actions">
      <app-newsletter-export-csv
        [search]="currentSearch"
        [status]="currentStatus">
      </app-newsletter-export-csv>
    </div>
  </div>

  <!-- Error alert box -->
  <div *ngIf="errorMessage" class="alert-box alert-error">
    <div class="alert-icon">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
        stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="12"></line>
        <line x1="12" y1="16" x2="12.01" y2="16"></line>
      </svg>
    </div>
    <div class="alert-content">
      {{ errorMessage }}
    </div>
  </div>

  <!-- Reusable Toolbar -->
  <app-admin-toolbar searchPlaceholder="Tìm kiếm theo email, tên khách hàng..." [searchValue]="currentSearch"
    [filterFields]="filterFields" [total]="displayTotal" [isLoading]="isLoading" (searchChange)="onSearch($event)"
    (filterChange)="onFilter($event)" (refresh)="onRefresh()">
  </app-admin-toolbar>

  <!-- Reusable Table -->
  <app-admin-table [columns]="columns" [data]="data" [loading]="isLoading" [actions]="actions" [pagination]="pagination"
    totalLabel="đăng ký" (actionClick)="onAction($event)" (pageChange)="onPageChange($event)"
    (pageSizeChange)="onPageSizeChange($event)">
  </app-admin-table>

  <!-- Modal Cập nhật trạng thái -->
  <div class="dialog-overlay" *ngIf="isStatusModalOpen && selectedSubscriber" (click)="closeStatusModal()" role="dialog"
    aria-modal="true" aria-labelledby="status-modal-title">
    <div class="dialog-panel status-modal-panel" (click)="$event.stopPropagation()">
      <!-- Header -->
      <div class="dialog-header">
        <div class="dialog-title-group">
          <div class="dialog-icon dialog-icon--status" aria-hidden="true">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
              <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
            </svg>
          </div>
          <h2 class="dialog-title" id="status-modal-title">Cập nhật trạng thái</h2>
        </div>
        <button type="button" class="dialog-close" [disabled]="isUpdatingStatus" (click)="closeStatusModal()"
          aria-label="Đóng">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>

      <!-- Body -->
      <div class="dialog-body">
        <div class="modal-info-card">
          <div class="info-row">
            <span class="info-label">Email khách hàng:</span>
            <span class="info-value info-email">{{ selectedSubscriber.email }}</span>
          </div>
          <div class="info-row"
            *ngIf="selectedSubscriber.customer?.name && selectedSubscriber.customer?.name !== 'Khách vãng lai'">
            <span class="info-label">Khách hàng:</span>
            <span class="info-value">{{ selectedSubscriber.customer.name }}</span>
          </div>
          <div class="info-row">
            <span class="info-label">Trạng thái hiện tại:</span>
            <span class="info-value">
              <span class="current-badge"
                [ngClass]="selectedSubscriber.status === 'SUBSCRIBED' ? 'badge-success' : 'badge-neutral'">
                {{ getStatusLabel(selectedSubscriber.status) }}
              </span>
            </span>
          </div>
        </div>

        <div class="form-group">
          <label for="new-status-select" class="form-label">
            Trạng thái mới <span class="required">*</span>
          </label>
          <div class="select-container">
            <select id="new-status-select" class="form-select status-select" [(ngModel)]="newStatus"
              [disabled]="isUpdatingStatus">
              <option *ngFor="let opt of statusOptions" [value]="opt.value">
                {{ opt.label }}
              </option>
            </select>
            <svg class="select-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </div>

        </div>
      </div>

      <!-- Footer -->
      <div class="dialog-footer">
        <button type="button" class="btn btn-secondary" id="btn-cancel-status-modal" (click)="closeStatusModal()"
          [disabled]="isUpdatingStatus">
          Hủy
        </button>
        <button type="button" class="btn btn-primary btn-save" id="btn-save-status-modal" (click)="saveStatusChange()"
          [disabled]="isUpdatingStatus || isStatusUnchanged">
          <span class="btn-spinner" *ngIf="isUpdatingStatus" aria-hidden="true"></span>
          <span>{{ isUpdatingStatus ? 'Đang lưu...' : 'Lưu thay đổi' }}</span>
        </button>
      </div>
    </div>
  </div>

</div>
