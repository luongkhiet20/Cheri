<div class="dash-card full-card">
  <div class="card-header" *ngIf="!noHeader && (title || icon)">
    <div class="card-title-group">
      <span class="card-icon" *ngIf="icon" [innerHTML]="icon"></span>
      <h2 class="card-title" *ngIf="title">{{ title }}</h2>
    </div>
    <div class="card-actions">
      <ng-content select="[card-actions]"></ng-content>
    </div>
  </div>
  <div class="card-body" [class.padded]="padded">
    <ng-content></ng-content>
  </div>
</div>
