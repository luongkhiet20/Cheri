<div class="admin-filter">
  <!-- Trigger button -->
  <button
    type="button"
    class="admin-filter__btn"
    (click)="togglePanel()"
    [class.is-active]="activeCount > 0 || isPanelOpen"
    id="admin-filter-btn"
    [attr.aria-expanded]="isPanelOpen"
  >
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="4" y1="6" x2="20" y2="6"/><line x1="8" y1="12" x2="16" y2="12"/>
      <line x1="11" y1="18" x2="13" y2="18"/>
    </svg>
    <span>Bộ lọc</span>
    <span class="admin-filter__count" *ngIf="activeCount > 0">{{ activeCount }}</span>
  </button>

  <!-- Filter panel -->
  <div class="admin-filter__panel" *ngIf="isPanelOpen" role="dialog" aria-label="Bộ lọc">
    <div class="admin-filter__panel-header">
      <span class="admin-filter__panel-title">Bộ lọc</span>
      <button class="admin-filter__panel-close" (click)="closePanel()" aria-label="Đóng bộ lọc">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    <div class="admin-filter__fields">
      <div class="admin-filter__field" *ngFor="let field of fields">
        <label class="form-label" [for]="'filter-' + field.key">{{ field.label }}</label>
        <select
          *ngIf="field.type === 'select'"
          class="form-control form-control--sm"
          [id]="'filter-' + field.key"
          [value]="values[field.key]"
          (change)="onFieldChange(field, $event)"
        >
          <option value="">-- Tất cả --</option>
          <option *ngFor="let opt of field.options" [value]="opt.value">{{ opt.label }}</option>
        </select>

        <input
          *ngIf="field.type === 'text'"
          type="text"
          class="form-control form-control--sm"
          [id]="'filter-' + field.key"
          [placeholder]="field.placeholder || ''"
          [value]="values[field.key]"
          (input)="onFieldChange(field, $event)"
        />
      </div>
    </div>

    <div class="admin-filter__panel-footer">
      <button class="btn btn-secondary btn-sm" type="button" (click)="resetAll()" id="filter-reset">Xóa tất cả</button>
      <button class="btn btn-primary btn-sm" type="button" (click)="applyFilters()" id="filter-apply">Áp dụng</button>
    </div>
  </div>

  <!-- Active filter tags -->
  <div class="admin-filter__tags" *ngIf="activeFilters.length > 0">
    <span class="admin-filter__tag" *ngFor="let af of activeFilters">
      <span>{{ af.label }}: <strong>{{ af.displayValue }}</strong></span>
      <button type="button" class="admin-filter__tag-remove"
              (click)="removeFilter(af.key)" [attr.aria-label]="'Xóa lọc ' + af.label">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </span>
  </div>
</div>
