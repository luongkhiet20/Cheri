<header class="admin-header">
  <div class="admin-header__brand">
    <a routerLink="/admin" class="admin-header__logo">
      <span class="admin-header__logo-text">Chéri</span>
      <span class="admin-header__logo-sub">Admin</span>
    </a>
  </div>

  <div class="admin-header__actions">
    <div class="admin-header__user" (clickOutside)="closeUserMenu()">
      <button
        class="admin-header__user-btn"
        (click)="toggleUserMenu()"
        [attr.aria-expanded]="isUserMenuOpen"
        aria-haspopup="true"
        id="admin-user-menu-btn"
      >
        <div class="admin-header__avatar" aria-hidden="true">
          <img *ngIf="currentUser?.avatar" [src]="currentUser.avatar" [alt]="currentUser.fullName || 'Admin'" class="admin-header__avatar-img" (error)="currentUser.avatar = null" />
          <span *ngIf="!currentUser?.avatar">{{ userInitial }}</span>
        </div>
        <div class="admin-header__user-info">
          <span class="admin-header__user-name">{{ currentUser?.fullName || currentUser?.name || currentUser?.username || 'Admin' }}</span>
          <span class="admin-header__user-role">{{ currentUser?.role || 'Quản trị viên' }}</span>
        </div>
        <svg class="admin-header__chevron" [class.is-open]="isUserMenuOpen"
             width="16" height="16" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      </button>

      <div class="admin-header__user-menu" *ngIf="isUserMenuOpen" role="menu" aria-labelledby="admin-user-menu-btn">
        <a [routerLink]="['/admin/account']" class="admin-header__menu-item" role="menuitem" (click)="navigateTo('/admin/account', $event)" id="header-menu-account">
          Thông tin tài khoản
        </a>
        <a [routerLink]="['/admin/settings']" class="admin-header__menu-item" role="menuitem" (click)="navigateTo('/admin/settings', $event)" id="header-menu-settings">
          Cài đặt
        </a>
        <div class="admin-header__menu-divider" role="separator"></div>
        <button class="admin-header__menu-item admin-header__menu-item--danger" role="menuitem" (click)="onLogout()">
          Đăng xuất
        </button>
      </div>
    </div>
  </div>
</header>
