<div
  class="chat-message-row"
  [class.from-user]="message.sender === 'user'"
  [class.from-store]="message.sender === 'store'"
>
  <div *ngIf="message.sender === 'store'" class="avatar-store" aria-hidden="true">
    <span>C</span>
  </div>

  <div class="message-content-wrap">
    <div
      class="message-bubble"
      [class.error-bubble]="message.isError"
      [class.user-bubble]="message.sender === 'user'"
      [class.store-bubble]="message.sender === 'store'"
    >
      <div class="message-text">{{ message.text }}</div>

      <div *ngIf="message.requiresAuth" class="auth-action-wrap">
        <a routerLink="/auth/sign-in" class="auth-btn" (click)="onAuth()">
          <span>Đăng nhập ngay</span>
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="13"
            height="13"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="lucide lucide-arrow-right"
            aria-hidden="true"
          >
            <path d="M5 12h14" />
            <path d="m12 5 7 7-7 7" />
          </svg>
        </a>
      </div>


      <div *ngIf="message.isError" class="retry-wrap">
        <button type="button" class="retry-btn" (click)="onRetry()">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="13"
            height="13"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
            <path d="M3 3v5h5" />
            <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16" />
            <path d="M16 21h5v-5" />
          </svg>
          Thử lại
        </button>
      </div>
    </div>

    <!-- Products Table -->
    <div *ngIf="message.products && message.products.length > 0" class="products-carousel">
      <app-chatbot-product-card
        [products]="message.products"
        (cardClick)="onProductClick($event)"
      ></app-chatbot-product-card>
    </div>

  </div>
</div>
