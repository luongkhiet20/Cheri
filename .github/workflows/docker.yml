name: CI & Docker Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-verify:
    name: Test & Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Reviews Unit Tests
        run: node server/src/reviews/reviews.service.test.cjs

      - name: Build Angular SSR
        run: npm run build:ssr

      - name: Build NestJS Server
        run: npm run build:server

  docker-build:
    name: Docker Image Build & Verification
    needs: test-and-verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check for Docker Hub Secrets
        id: check-secrets
        run: |
          if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ] && [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "can_push=true" >> $GITHUB_OUTPUT
          else
            echo "can_push=false" >> $GITHUB_OUTPUT
          fi

      - name: Log in to Docker Hub (if secrets provided)
        if: steps.check-secrets.outputs.can_push == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build (and push if configured) Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ steps.check-secrets.outputs.can_push == 'true' }}
          tags: ${{ steps.check-secrets.outputs.can_push == 'true' && format('{0}/cheri-fashion:latest', secrets.DOCKERHUB_USERNAME) || 'cheri-fashion:latest' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
