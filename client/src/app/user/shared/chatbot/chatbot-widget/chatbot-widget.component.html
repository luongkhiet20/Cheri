<aside class="chatbot-root" aria-label="Hỗ trợ trực tuyến Chéri">
  <!-- Conversation Window -->
  <div *ngIf="state.isOpen()" class="chatbot-window-container">
    <app-chatbot-window></app-chatbot-window>
  </div>

  <!-- Floating Launcher Button -->
  <button
    type="button"
    class="chatbot-launcher-btn"
    [class.active]="state.isOpen()"
    (click)="toggle()"
    [attr.aria-expanded]="state.isOpen()"
    aria-label="Mở trò chuyện cùng Chéri"
    title="Trò chuyện cùng Chéri"
  >
    <!-- Message Circle SVG when closed -->
    <svg
      *ngIf="!state.isOpen()"
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      class="lucide lucide-message-circle launcher-icon"
      aria-hidden="true"
    >
      <path
        d="M2.992 16.342a2 2 0 0 1 .094 1.167l-1.065 3.29a1 1 0 0 0 1.236 1.168l3.413-.998a2 2 0 0 1 1.099.092 10 10 0 1 0-4.777-4.719"
      />
    </svg>

    <!-- Close X SVG when open -->
    <svg
      *ngIf="state.isOpen()"
      xmlns="http://www.w3.org/2000/svg"
      width="24"
      height="24"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2.2"
      stroke-linecap="round"
      stroke-linejoin="round"
      class="launcher-icon close-icon"
      aria-hidden="true"
    >
      <line x1="18" y1="6" x2="6" y2="18" />
      <line x1="6" y1="6" x2="18" y2="18" />
    </svg>

    <!-- Notification Pulse Dot -->
    <span *ngIf="!state.isOpen()" class="launcher-pulse-badge" aria-hidden="true"></span>
  </button>
</aside>
