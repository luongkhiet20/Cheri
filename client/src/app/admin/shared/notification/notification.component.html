<div class="notification-container" aria-live="polite" aria-atomic="true">
  <div
    *ngFor="let item of notifications; trackBy: trackById"
    class="notification-toast"
    [class.notification-toast--success]="item.type === 'success'"
    [class.notification-toast--error]="item.type === 'error'"
    [class.is-leaving]="item.isLeaving"
    (mouseenter)="onMouseEnter(item.id)"
    (mouseleave)="onMouseLeave(item.id)"
    role="status"
    tabindex="0"
  >
    <!-- Biểu tượng trạng thái -->
    <div class="notification-icon" aria-hidden="true">
      <!-- Success: Dấu tích xanh lá -->
      <svg *ngIf="item.type === 'success'" width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="4 10.5 8 14.5 16 6"></polyline>
      </svg>

      <!-- Error: Biểu tượng dấu X cảnh báo lỗi -->
      <svg *ngIf="item.type === 'error'" width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="10" cy="10" r="8"></circle>
        <line x1="7" y1="7" x2="13" y2="13"></line>
        <line x1="13" y1="7" x2="7" y2="13"></line>
      </svg>
    </div>

    <!-- Nội dung thông báo -->
    <div class="notification-body">
      <p class="notification-message">{{ item.message }}</p>
    </div>

    <!-- Nút đóng thủ công -->
    <button
      type="button"
      class="notification-close-btn"
      (click)="onDismiss(item.id)"
      title="Đóng thông báo"
      aria-label="Đóng thông báo"
    >
      <svg width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="15" y1="5" x2="5" y2="15"></line>
        <line x1="5" y1="5" x2="15" y2="15"></line>
      </svg>
    </button>
  </div>
</div>
