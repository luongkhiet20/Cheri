<div class="main-scroll-wrap" [class.no-header]="isDashboard || isAdmin()" id="main-content" (scroll)="onScrolling($event)">
  <!-- Header & Footer bị ẩn khi ở trang admin dashboard (isDashboard=true)
       hoặc khi user đăng nhập có roles là admin, vì Admin có layout riêng trong app/admin/layout/ -->
  <app-header *ngIf="!isDashboard && !isAdmin()"></app-header>
  <router-outlet
    (activate)="onActivate($event)"
    (deactivate)="onDeactivate($event)">
  </router-outlet>
  <app-footer *ngIf="!isDashboard && !isAdmin()"> </app-footer>
</div>
