@if(orders$()?.length) {
<app-orders-list
  [orders]="orders$()"
  [orderUrl]="'/' + (lang$ | async) + '/dashboard/orders/'">
</app-orders-list>
} @else {
<div style="text-align: center; padding: 3rem 1rem; color: #757575; background: #ffffff; border-radius: 12px; border: 1px dashed #e5d9d4;">
  <div style="display: flex; justify-content: center; margin-bottom: 0.75rem; color: #757575;">
    <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
      <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
    </svg>
  </div>
  <h3 style="margin-bottom: 0.5rem; color: #2b2b2b;">Chưa có đơn hàng nào</h3>
  <p style="margin: 0; font-size: 0.9rem;">Các đơn đặt hàng mới từ khách hàng sẽ được hiển thị và quản lý tại đây.</p>
</div>
}
