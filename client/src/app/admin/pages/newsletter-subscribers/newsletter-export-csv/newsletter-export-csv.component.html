<button
  class="btn btn-secondary btn-export-csv"
  id="btn-export-newsletter-csv"
  type="button"
  (click)="exportCsv()"
  [disabled]="isExporting || disabled"
  title="Xuất danh sách đăng ký nhận ưu đãi ra file CSV"
  aria-label="Xuất báo cáo CSV">
  <svg *ngIf="!isExporting" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
    <polyline points="7 10 12 15 17 10"></polyline>
    <line x1="12" y1="15" x2="12" y2="3"></line>
  </svg>
  <span *ngIf="isExporting" class="spinner-border spinner-border-sm" role="status" aria-hidden="true" style="width: 13px; height: 13px; border-width: 2px;"></span>
  <span>{{ isExporting ? 'Đang xuất...' : 'Xuất báo cáo' }}</span>
</button>
