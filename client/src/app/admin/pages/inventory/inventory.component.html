<div class="page-content">
  <div class="page-top">
    <div>
      <h1 class="page-title">Quản lý tồn kho</h1>
    </div>
    <div class="page-actions">
      <button class="btn btn-primary" id="btn-add-inventory" (click)="onImportInventory()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        Nhập kho
      </button>
    </div>
  </div>
  <app-admin-toolbar searchPlaceholder="Tìm kiếm..." [filterFields]="filterFields" [selectable]="true"
    [allSelected]="allSelected" [indeterminate]="isIndeterminate" [selectedCount]="selectedCount"
    [showDeleteSelected]="true" [total]="displayTotal" [isLoading]="isLoading" (searchChange)="onSearch($event)"
    (filterChange)="onFilter($event)" (refresh)="onRefresh()" (selectAllChange)="onToolbarSelectAll()"
    (deleteSelected)="onDeleteSelected()">
  </app-admin-toolbar>
  <app-admin-table [columns]="columns" [data]="data" [loading]="isLoading" [actions]="actions" [pagination]="pagination"
    [selectable]="true" [selectedIds]="selectedIds" totalLabel="sản phẩm" (actionClick)="onAction($event)"
    (selectionChange)="onSelectionChange($event)" (pageChange)="onPageChange($event)"
    (pageSizeChange)="onPageSizeChange($event)">
  </app-admin-table>
</div>
<app-confirm-dialog [isOpen]="confirmOpen" title="Xác nhận xóa" [message]="confirmMessage" confirmLabel="Xóa"
  variant="danger" (confirmed)="onConfirmDelete()" (cancelled)="onCancelDelete()">
</app-confirm-dialog>
