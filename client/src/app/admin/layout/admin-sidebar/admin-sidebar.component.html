<nav class="admin-sidebar" [class.is-open]="isMobileOpen" [class.is-collapsed]="isCollapsed" role="navigation"
  aria-label="Admin navigation">
  <!-- Mobile overlay backdrop -->
  <div class="admin-sidebar__overlay" *ngIf="isMobileOpen" (click)="closeMobile()" aria-hidden="true"></div>

  <!-- Nút thu gọn / mở rộng Sidebar dạng Floating Toggle ở mép phải, gần đỉnh sidebar -->
  <button type="button" class="admin-sidebar__floating-toggle" (click)="toggleCollapse()"
    [attr.aria-label]="isCollapsed ? 'Mở rộng sidebar' : 'Thu gọn sidebar'"
    [attr.title]="isCollapsed ? 'Mở rộng sidebar' : 'Thu gọn sidebar'">
    <!-- Khi mở rộng: mũi tên hướng sang trái biểu thị thu gọn -->
    <svg *ngIf="!isCollapsed" class="admin-sidebar__toggle-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <polyline points="15 18 9 12 15 6"></polyline>
    </svg>
    <!-- Khi thu gọn: mũi tên hướng sang phải biểu thị mở rộng -->
    <svg *ngIf="isCollapsed" class="admin-sidebar__toggle-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <polyline points="9 18 15 12 9 6"></polyline>
    </svg>
  </button>

  <div class="admin-sidebar__inner">
    <!-- Header drawer dành riêng cho mobile khi mở sidebar -->
    <div class="admin-sidebar__mobile-header">
      <div class="admin-sidebar__mobile-brand">
        <span class="admin-sidebar__mobile-title">Chéri</span>
        <span class="admin-sidebar__mobile-sub">Admin</span>
      </div>
      <button type="button" class="admin-sidebar__mobile-close" (click)="closeMobile()" aria-label="Đóng menu">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>



    <!-- Vùng cuộn menu (Bắt đầu trực tiếp từ TỔNG QUAN như hình mẫu) -->
    <div class="admin-sidebar__scroll-area">
      <div class="admin-sidebar__nav-groups" role="list">
        <!-- 3 Nhóm đầu: TỔNG QUAN, KINH DOANH, VẬN HÀNH -->
        <div class="admin-sidebar__group" *ngFor="let group of navGroups">
          <div class="admin-sidebar__group-label" *ngIf="!isCollapsed">
            {{ group.title }}
          </div>
          <ul class="admin-sidebar__group-list" role="list">
            <li class="admin-sidebar__item" *ngFor="let item of group.items">
              <a [routerLink]="item.route" routerLinkActive="is-active"
                [routerLinkActiveOptions]="item.exact ? { exact: true } : { exact: false }" class="admin-sidebar__link"
                [attr.aria-current]="isActive(item.route) ? 'page' : null" (click)="closeMobile()"
                [attr.title]="item.label" [attr.aria-label]="item.label">
                <span class="admin-sidebar__icon-wrap" aria-hidden="true" [ngSwitch]="item.icon">
                  <!-- Dashboard -->
                  <svg *ngSwitchCase="'dashboard'" class="admin-sidebar__icon" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="7" height="7" rx="2"></rect>
                    <rect x="14" y="3" width="7" height="7" rx="2"></rect>
                    <rect x="14" y="14" width="7" height="7" rx="2"></rect>
                    <rect x="3" y="14" width="7" height="7" rx="2"></rect>
                  </svg>

                  <!-- Quản lý sản phẩm -->
                  <svg *ngSwitchCase="'products'" xmlns="http://www.w3.org/2000/svg" class="admin-sidebar__icon" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M6 8h12l-1 12a2 2 0 0 1-2 1.8H9a2 2 0 0 1-2-1.8L6 8z"></path>
                    <path d="M9 8V6a3 3 0 0 1 6 0v2"></path>
                  </svg>

                  <!-- Quản lý danh mục -->
                  <svg *ngSwitchCase="'categories'" class="admin-sidebar__icon" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6z"></path>
                    <line x1="3" y1="10" x2="21" y2="10"></line>
                  </svg>

                  <!-- Quản lý đơn hàng -->
                  <svg *ngSwitchCase="'orders'" class="admin-sidebar__icon" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
                    <rect x="8" y="2" width="8" height="4" rx="1"></rect>
                    <line x1="8" y1="11" x2="16" y2="11"></line>
                    <line x1="8" y1="15" x2="13" y2="15"></line>
                  </svg>

                  <!-- Mã giảm giá -->
                  <svg *ngSwitchCase="'coupons'" class="admin-sidebar__icon" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path
                      d="M2 9a3 3 0 0 1 0 6v4a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-4a3 3 0 0 1 0-6V5a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v4z">
                    </path>
                    <line x1="9" y1="12" x2="15" y2="12"></line>
                  </svg>

                  <!-- Phương thức thanh toán -->
                  <svg *ngSwitchCase="'payment-methods'" class="admin-sidebar__icon" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="5" width="20" height="14" rx="2"></rect>
                    <line x1="2" y1="10" x2="22" y2="10"></line>
                  </svg>

                  <!-- Đơn vị vận chuyển -->
                  <svg *ngSwitchCase="'shipping-methods'" class="admin-sidebar__icon" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="1" y="3" width="15" height="13" rx="1"></rect>
                    <polygon points="16 8 20 8 23 11 23 16 16 16 8"></polygon>
                    <circle cx="5.5" cy="18.5" r="2.5"></circle>
                    <circle cx="18.5" cy="18.5" r="2.5"></circle>
                  </svg>

                  <!-- Quản lý tài khoản -->
                  <svg *ngSwitchCase="'users'" class="admin-sidebar__icon" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                    <circle cx="9" cy="7" r="4"></circle>
                    <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                    <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                  </svg>

                  <!-- Quản lý tồn kho -->
                  <svg *ngSwitchCase="'inventory'" class="admin-sidebar__icon" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="4" width="18" height="4" rx="1"></rect>
                    <path d="M5 8v11a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8"></path>
                    <line x1="10" y1="12" x2="14" y2="12"></line>
                  </svg>

                  <!-- Quản lý tin nhắn -->
                  <svg *ngSwitchCase="'messages'" class="admin-sidebar__icon" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                  </svg>

                  <!-- Quản lý đánh giá -->
                  <svg *ngSwitchCase="'reviews'" class="admin-sidebar__icon" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
                  </svg>
                  <!-- Đăng ký nhận ưu đãi -->
                  <svg *ngSwitchCase="'subscribers'" class="admin-sidebar__icon" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                    <polyline points="22,6 12,13 2,6"></polyline>
                  </svg>

                  <!-- Trang chủ -->
                  <svg *ngSwitchCase="'home'" class="admin-sidebar__icon" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    <polyline points="9 22 9 12 15 12 15 22"></polyline>
                  </svg>

                  <!-- Giới thiệu -->
                  <svg *ngSwitchCase="'about'" class="admin-sidebar__icon" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="16" x2="12" y2="12"></line>
                    <line x1="12" y1="8" x2="12.01" y2="8"></line>
                  </svg>

                  <!-- Chính sách -->
                  <svg *ngSwitchCase="'policies'" class="admin-sidebar__icon" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                    <polyline points="14 2 14 8 20 8"></polyline>
                    <line x1="16" y1="13" x2="8" y2="13"></line>
                    <line x1="16" y1="17" x2="8" y2="17"></line>
                    <polyline points="10 9 9 9 8 9"></polyline>
                  </svg>
                </span>

                <span class="admin-sidebar__link-text">{{ item.label }}</span>
                <span class="admin-sidebar__tooltip" aria-hidden="true">{{ item.label }}</span>
              </a>
            </li>
          </ul>
        </div>
      </div>
    </div>
  </div>
</nav>
