<style>
.spinner {
  height: 100px;
  width: 100px;
  animation: rotate 0.9s infinite linear;
  border: 15px solid #000;
  border-right-color: transparent;
  border-radius: 50%;
  margin: 100px auto;
}

@keyframes rotate {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}
</style>
