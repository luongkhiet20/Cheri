<header class="admin-header">
  <div class="header-left">
    <h1 class="page-title">{{ pageTitle }}</h1>
    <div class="breadcrumb">
      <span>Admin</span>
      <span class="breadcrumb-sep">›</span>
      <span>{{ pageTitle }}</span>
    </div>
  </div>

  <div class="header-right">
    <!-- Projected actions (e.g. quick actions) -->
    <ng-content select="[header-actions]"></ng-content>

    <!-- Search -->
    <div class="header-search">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8" />
        <line x1="21" y1="21" x2="16.65" y2="16.65" />
      </svg>
      <input type="text" placeholder="Tìm kiếm..." class="search-input" [ngModel]="searchQuery"
        (ngModelChange)="onSearchChange($event)" id="admin-search" />
    </div>

    <!-- Notification bell -->
    <button class="header-btn" id="btn-notifications" title="Thông báo" (click)="onNotificationClick()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
        <path d="M13.73 21a2 2 0 0 1-3.46 0" />
      </svg>
      <span class="notif-dot"></span>
    </button>

    <!-- Avatar / account -->
    <div class="header-avatar" id="btn-account" title="Tài khoản quản trị" (click)="onAccountClick()">
      <span class="avatar-initials">AD</span>
      <div class="avatar-info" *ngIf="!sidebarCollapsed">
        <span class="avatar-name">Admin</span>
        <span class="avatar-role">Quản trị viên</span>
      </div>
    </div>
  </div>
</header>
