<div class="page-content">
  <div class="page-top">
    <div>
      <h1 class="page-title">Quản lý đơn hàng</h1>
    </div>
    <div class="page-actions">
      <button class="btn btn-primary" id="btn-add-orders">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="7 10 12 15 17 10"></polyline>
          <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
        Xuất báo cáo
      </button>
    </div>
  </div>

  <app-admin-toolbar searchPlaceholder="Tìm kiếm..." [filterFields]="filterFields" [selectable]="true"
    [allSelected]="allSelected" [indeterminate]="isIndeterminate" [selectedCount]="selectedCount"
    [showDeleteSelected]="true" [total]="displayTotal" [isLoading]="isLoading" (searchChange)="onSearch($event)"
    (filterChange)="onFilter($event)" (refresh)="onRefresh()" (selectAllChange)="onToolbarSelectAll()"
    (deleteSelected)="onDeleteSelected()"></app-admin-toolbar>

  <app-admin-table [columns]="columns" [data]="data" [loading]="isLoading" [actions]="actions" [pagination]="pagination"
    [selectable]="true" [selectedIds]="selectedIds" totalLabel="đơn hàng" (actionClick)="onAction($event)"
    (selectionChange)="onSelectionChange($event)" (pageChange)="onPageChange($event)"
    (pageSizeChange)="onPageSizeChange($event)"></app-admin-table>
</div>

<app-confirm-dialog [isOpen]="confirmOpen" title="Xác nhận xóa" [message]="confirmMessage" confirmLabel="Xóa"
  variant="danger" (confirmed)="onConfirmDelete()" (cancelled)="onCancelDelete()"></app-confirm-dialog>
