<div class="action-buttons" role="group" aria-label="Thao tác">
  <ng-container *ngFor="let action of actions">
    <button *ngIf="isVisible(action)" [ngClass]="getButtonClass(action)" [disabled]="action.disabled"
      (click)="onClick(action)" [id]="'action-' + action.key + '-' + (row?.id || row?._id || 0)"
      [attr.aria-label]="action.tooltip || action.label"
      [title]="action.tooltip || action.label"
      type="button">
      <svg *ngIf="action.icon === 'copy'" class="action-btn-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
      </svg>
      <svg *ngIf="action.icon === 'status' || action.icon === 'edit' || action.icon === 'update'" class="action-btn-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
      </svg>
      <span>{{ action.label }}</span>
    </button>
  </ng-container>
</div>
