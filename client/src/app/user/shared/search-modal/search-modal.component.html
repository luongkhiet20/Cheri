@if (isOpen) {
<div class="cheri-search-wrapper" (click)="onBackdropClick($event)">
  <!-- Backdrop Overlay (tối nhẹ phía sau) -->
  <div class="cheri-search-backdrop"></div>

  <!-- Thanh tìm kiếm sát phía trên viewport, chiếm toàn bộ chiều rộng màn hình -->
  <div class="cheri-top-search-bar" (click)="$event.stopPropagation()">
    <form class="cheri-search-bar-form" (ngSubmit)="submitSearch()">
      <!-- Biểu tượng kính lúp SVG bên trái -->
      <button type="submit" class="cheri-search-icon-btn" aria-label="Tìm kiếm" [disabled]="isLoading">
        <svg class="cheri-search-svg-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#74070E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </button>

      <!-- Ô nhập từ khóa ở giữa, tận dụng toàn bộ không gian còn lại -->
      <input
        #searchInput
        type="text"
        class="cheri-search-input"
        placeholder="Tìm kiếm sản phẩm...."
        [(ngModel)]="keyword"
        name="searchKeyword"
        autocomplete="off"
      />

      <!-- Nút đóng ở mép phải có vùng bấm riêng, đường phân cách dọc tinh tế và biểu tượng SVG dấu X màu #74070E -->
      <button
        type="button"
        class="cheri-search-close"
        (click)="closeModal()"
        aria-label="Đóng tìm kiếm"
      >
        <svg class="cheri-close-svg-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#74070E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </form>

    <!-- Dropdown gợi ý tìm kiếm & thông báo lỗi bên dưới thanh tìm kiếm -->
    @if (errorMessage || (suggestions && suggestions.length > 0)) {
    <div class="cheri-search-dropdown-panel">
      <!-- Error alert -->
      @if (errorMessage) {
      <div class="cheri-search-error">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <span>{{ errorMessage }}</span>
      </div>
      }

      <!-- Suggestions chips -->
      @if (suggestions && suggestions.length > 0) {
      <div class="cheri-suggestions-row">
        <span class="cheri-suggestions-label">Gợi ý tìm kiếm:</span>
        <div class="cheri-suggestions-list">
          @for (s of suggestions; track s) {
          <button type="button" class="cheri-suggestion-chip" (click)="selectSuggestion(s)">
            {{ s }}
          </button>
          }
        </div>
      </div>
      }
    </div>
    }
  </div>
</div>
}
