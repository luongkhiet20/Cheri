# ==============================================================================
# Docker Compose for Chéri Fashion Ecommerce
# ==============================================================================

name: cheri-fashion

services:
  # ----------------------------------------------------------------------------
  # 1. Main Fullstack App (Angular 20 SSR + NestJS Backend API + Admin Server)
  # ----------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cheri_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=4000
      - ADMIN_PORT=5000
      # By default, connects to MongoDB Atlas as specified in .env
    ports:
      - "4000:4000"   # SSR Storefront & NestJS Customer APIs
      - "5000:5000"   # Express Admin Management Server
    volumes:
      # Persist local uploads (payment proofs, invoices) across container recreation
      - uploads_data:/usr/src/app/server/uploads
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:4000/api/cheri/home || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ----------------------------------------------------------------------------
  # 2. Reverse Proxy Nginx (Optional: docker compose --profile proxy up -d)
  # Unifies frontend & backend behind a single port (80 / 3000) with caching
  # ----------------------------------------------------------------------------
  web:
    image: nginx:alpine
    container_name: cheri_web
    profiles:
      - proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "3000:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # 3. Local MongoDB (Optional: docker compose --profile local-db up -d)
  # Only needed if you want an offline database instead of MongoDB Atlas
  # ----------------------------------------------------------------------------
  mongo:
    image: mongo:7.0-jammy
    container_name: cheri_mongo
    profiles:
      - local-db
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=cheri
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.adminCommand(\"ping\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  uploads_data:
    driver: local
  mongo_data:
    driver: local
