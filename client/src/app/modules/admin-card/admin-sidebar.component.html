<aside class="admin-sidebar" [class.collapsed]="sidebarCollapsed">
  <!-- Brand Header -->
  <div class="sidebar-brand-header">
    <a (click)="onGoToDashboard($event)" class="cheri-logo" title="Về Dashboard">
      Chéri
    </a>

    <!-- Toggle button -->
    <button class="sidebar-toggle" (click)="onToggleSidebar()" [title]="sidebarCollapsed ? 'Mở rộng' : 'Thu gọn'">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="3" y1="6" x2="21" y2="6" />
        <line x1="3" y1="12" x2="21" y2="12" />
        <line x1="3" y1="18" x2="21" y2="18" />
      </svg>
    </button>
  </div>

  <!-- Navigation -->
  <nav class="sidebar-nav">
    <div class="nav-section-label" *ngIf="!sidebarCollapsed">QUẢN LÝ</div>

    <a class="nav-item" *ngFor="let item of navItems" [class.active]="activeSection === item.key"
      (click)="onSetSection(item.key)" [title]="item.label" style="cursor: pointer;">
      <span class="nav-icon" [innerHTML]="getSafeIcon(item.icon)"></span>
      <span class="nav-label" *ngIf="!sidebarCollapsed">{{ item.label }}</span>
      <span class="nav-badge" *ngIf="item.badge && !sidebarCollapsed">{{ item.badge }}</span>
    </a>
  </nav>

  <!-- Bottom actions -->
  <div class="sidebar-bottom">
    <div class="nav-divider"></div>

    <a class="nav-item" (click)="onSetSection('config')" [class.active]="activeSection === 'config'"
      title="Cài đặt hệ thống" style="cursor: pointer;">
      <span class="nav-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3" />
          <path
            d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
        </svg>
      </span>
      <span class="nav-label" *ngIf="!sidebarCollapsed">Cài đặt hệ thống</span>
    </a>

    <button class="nav-item nav-logout" (click)="onLogout()" title="Đăng xuất">
      <span class="nav-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
          <polyline points="16 17 21 12 16 7" />
          <line x1="21" y1="12" x2="9" y2="12" />
        </svg>
      </span>
      <span class="nav-label" *ngIf="!sidebarCollapsed">Đăng xuất</span>
    </button>
  </div>
</aside>
