<div class="profile-page-wrapper">

  <!-- ── HERO CARD: Avatar + Name + Member ID + Logout ── -->
  <div class="profile-hero-card">
    <div class="profile-avatar-wrap">
      <div class="profile-avatar-circle" (click)="openAvatarPicker()" title="Nhấp để thay đổi ảnh đại diện"
        role="button" tabindex="0" (keydown.enter)="openAvatarPicker()" (keydown.space)="openAvatarPicker()">
        <img *ngIf="getAvatarUrl()" [src]="getAvatarUrl()" (error)="onAvatarImgError()" alt="Ảnh đại diện"
          class="profile-avatar-image" />

        <span *ngIf="!getAvatarUrl()">
          {{ getUserInitial() }}
        </span>

        <div class="profile-avatar-loading" *ngIf="isUploadingAvatar">
          <div class="avatar-spinner"></div>
        </div>
      </div>

      <input #avatarFileInput type="file" accept="image/png,image/jpeg,image/jpg,image/webp" hidden
        (change)="onAvatarSelected($event)" />
    </div>
    <div class="profile-hero-info">
      <div class="profile-member-badges">
        <span class="profile-member-tier" *ngIf="getRoleLabel()">{{ getRoleLabel() }}</span>
        <span class="profile-member-id" *ngIf="getMemberCode()">{{ getMemberCode() }}</span>
      </div>
      <h2 class="profile-hero-name">{{ getDisplayName() }}</h2>
      <p class="profile-hero-email">{{ user$()?.email }}</p>
      <div class="profile-avatar-error" *ngIf="avatarUploadError">
        {{ avatarUploadError }}
      </div>
    </div>
    <div class="profile-hero-action">
      <button type="button" class="profile-logout-btn" (click)="onLogout()" title="Đăng xuất khỏi tài khoản">
        <span>Đăng xuất</span>
      </button>
    </div>
  </div>

  <div class="profile-container">

    <!-- ── MAIN GRID: Orders (left) + Profile Sidebar (right) ── -->
    <div class="profile-main-grid">

      <!-- LEFT: Orders Component -->
      <app-profile-orders
        [orders]="userOrders$()"
        [user]="user$()"
        [lang]="lang$ | async"
        [lastSyncTime]="lastSyncTime"
        (cancelOrder)="openCancelDialog($event)"
        (reviewOrder)="openReviewDialog($event)"
        (editReviewOrder)="openEditReviewDialog($event)"
        (returnRefundOrder)="openReturnRefundDialog($event)"
        (cancelReturnOrder)="openReturnCancelDialog($event)">
      </app-profile-orders>

      <!-- RIGHT: Profile Info Component -->
      <app-profile-info
        [user]="user$()"
        (profileUpdated)="onProfileUpdated($event)">
      </app-profile-info>

    </div><!-- /profile-main-grid -->

  </div>

  <!-- ── ORDER CANCEL POPUP DIALOG ── -->
  <app-order-cancel-dialog *ngIf="isCancelDialogOpen" [order]="selectedOrderToCancel" (close)="closeCancelDialog()"
    (cancelled)="onOrderCancelled($event)">
  </app-order-cancel-dialog>

  <!-- ── PRODUCT REVIEW POPUP DIALOG ── -->
  <app-product-review-dialog *ngIf="isReviewDialogOpen" [order]="selectedOrderToReview" [isEditMode]="isReviewEditMode"
    (close)="closeReviewDialog()" (reviewed)="onOrderReviewed($event)">
  </app-product-review-dialog>

  <!-- ── ORDER RETURN / REFUND POPUP DIALOG ── -->
  <app-order-return-refund-dialog *ngIf="isReturnRefundDialogOpen" [order]="selectedOrderToReturn"
    (close)="closeReturnRefundDialog()" (submitted)="onReturnRefundSubmitted($event)">
  </app-order-return-refund-dialog>

  <!-- ── ORDER RETURN / REFUND CANCEL POPUP DIALOG ── -->
  <app-order-return-cancel-dialog *ngIf="isReturnCancelDialogOpen" [order]="selectedOrderToCancelReturn"
    [returnRequest]="selectedReturnRequestToCancel" (close)="closeReturnCancelDialog()"
    (cancelled)="onReturnRequestCancelled($event)">
  </app-order-return-cancel-dialog>
</div>
